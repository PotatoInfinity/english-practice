<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HSG English Drill</title>
<link rel="stylesheet" href="styles.css" />
<script type="module" src="main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="title">HSG English Drill — Sentence Transformation</div>
  <div class="controls">
    <select id="cat" title="Category">
      <option value="all">All categories</option>
      <option value="light_verb">Light verbs</option>
      <option value="prep_idiom">Prepositional idioms</option>
      <option value="figurative">Figurative idioms</option>
      <option value="binomial">Binomials</option>
      <option value="rephrase">Rephrasing frames</option>
      <option value="inversion">Inversion</option>
      <option value="mcq">Multiple choice</option>
      <option value="three_in_one">One word × three</option>
      <option value="wordform">Word formation</option>
      <option value="blank_fill">Open cloze</option>
    </select>
    <span id="pomo" title="Pomodoro focus timer">
      <span id="pomoTime">25:00</span>
      <button id="pomoStart" title="Start / pause">Start</button>
      <button id="pomoSkip" title="Skip to next phase">Skip</button>
      <span id="pomoDots" title="Focus blocks this cycle"></span>
      <span id="pomoDone" title="Focus blocks completed"></span>
    </span>
  </div>
</header>
<main class="sheet">
  <div class="sheet-head">Sentence transformation — write the missing part. Keyword in brackets must be used.</div>
  <ol id="list"></ol>
  <div id="more"></div>
  <div class="foot">
    <button id="check">Check</button>
    <button id="reveal">Reveal</button>
    <button id="latest" title="Scroll to latest solved item">Latest solve</button>
    <span id="filters" title="Filter rows">
      <button data-f="all" class="on">All</button><button data-f="ok">Correct</button><button data-f="no">Wrong</button>
    </span>
    <span id="score"></span>
  </div>
</main>
</body>
</html>
