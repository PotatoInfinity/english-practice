<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HSG English Drill</title>
<link rel="stylesheet" href="styles.css" />
<script type="module" src="main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="title">HSG English Drill</div>
  <div class="controls">
    <button id="latest" title="Jump to latest solved item">Latest solve</button>
    <span id="pomo" title="Pomodoro focus timer">
      <span id="pomoTime">25:00</span>
      <button id="pomoStart" title="Start / pause">Start</button>
      <button id="pomoSkip" title="Skip to next phase">Skip</button>
      <span id="pomoDots" title="Focus blocks this cycle"></span>
      <span id="pomoDone" title="Focus blocks completed"></span>
    </span>
  </div>
</header>
<main class="sheet">
  <ol id="list"></ol>
  <div id="more"></div>
  <div class="foot">
    <button id="check">Check</button>
    <button id="reveal">Reveal</button>
    <span id="filters" title="Filter rows">
      <button data-f="all" class="on">All</button><button data-f="ok">Correct</button><button data-f="no">Wrong</button>
    </span>
    <span id="score"></span>
  </div>
</main>
</body>
</html>
